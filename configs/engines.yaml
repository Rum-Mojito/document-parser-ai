# OCR 引擎注册表
# 新增引擎只需在此加一条配置，并提供对应的适配器类，无需改动核心代码。
# 本期场景：英文单语（外企环境）；多语言能力框架保留、配置关闭。

default_engine: tesseract   # 内部模型接入后改为 internal；M4 实测后再定版

engines:
  internal:
    adapter: app.adapters.internal_template.InternalModelAdapter
    languages: [en]               # TODO: 以内部模型实际能力为准
    default_for: [en]
    resources: { device: cpu, preload: false }
    enabled: false                # 内部模型接入完成后置为 true

  tesseract:
    adapter: app.adapters.tesseract_adapter.TesseractAdapter
    languages: [eng]
    default_for: [en]
    resources: { device: cpu, preload: true }
    enabled: true                 # 主力候选A：清晰规整文档

  easyocr:
    adapter: app.adapters.easyocr_adapter.EasyOcrAdapter
    languages: [en]
    default_for: []
    resources: { device: cpu, preload: false }   # 懒加载
    enabled: true                 # 主力候选B：低质量扫描件兜底

  rapidocr:
    adapter: app.adapters.rapidocr_adapter.RapidOcrAdapter
    languages: [en]
    default_for: []
    resources: { device: cpu, preload: false }
    enabled: false                # 优势在中文场景，本期不启用

# VLM 路线（英文是 Granite-Docling 等模型效果最强的场景，可提前评估）
vlm_fallback:
  enabled: false
  pipeline: vlm
  model: granite_docling   # 需 GPU
